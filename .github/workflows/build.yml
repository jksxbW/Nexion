name: Prüfen und Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON und Sprites prüfen
        run: python3 .github/scripts/validate.py

      - name: Mod-ZIP bauen
        run: |
          mkdir -p dist
          zip -r -q "dist/nexion-${GITHUB_REF_NAME//\//-}.zip" mod.json icon.png content sprites sprites-override

      - uses: actions/upload-artifact@v4
        with:
          name: nexion-mod
          path: dist/*.zip

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
